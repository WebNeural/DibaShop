<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه دیبا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
       <link rel="stylesheet" href="css/style.css?v=99">
</head>
<body data-page="home">

    <header id="siteHeader"></header>
    <div class="toast-container" id="toastContainer"></div>

    <main>
        <section class="hero">
            <div class="hero-pattern"></div>
            <div class="hero-content">
                <p class="hero-eyebrow">بازار آنلاین دیبا</p>
                <h1>فروشگاهی که<br>بهش اعتماد داری</h1>
                <p class="hero-sub">از موبایل تا لوازم خانه، با ضمانت اصالت کالا و ارسال سریع به سراسر کشور</p>
                <a href="products.html" class="btn btn-gold">شروع خرید</a>
            </div>
        </section>

        <div class="trust-bar">
            <div class="trust-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 7H15V17H3V7Z" stroke="#C79A3E" stroke-width="1.6"/><path d="M15 10H18L21 13V17H15V10Z" stroke="#C79A3E" stroke-width="1.6"/><circle cx="7" cy="19" r="1.6" stroke="#C79A3E" stroke-width="1.4"/><circle cx="17" cy="19" r="1.6" stroke="#C79A3E" stroke-width="1.4"/></svg>
                <span>ارسال سریع به سراسر کشور</span>
            </div>
            <div class="trust-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L20 5V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V5L12 2Z" stroke="#C79A3E" stroke-width="1.6" stroke-linejoin="round"/></svg>
                <span>ضمانت اصالت کالا</span>
            </div>
            <div class="trust-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="#C79A3E" stroke-width="1.6"/><path d="M3 10H21" stroke="#C79A3E" stroke-width="1.6"/></svg>
                <span>پرداخت امن آنلاین</span>
            </div>
        </div>

        <section class="categories">
            <h2 class="section-title">دسته‌بندی‌ها</h2>
            <div class="category-list" id="categoryList"></div>
        </section>

        <div id="productSections"></div>
    </main>

    <footer id="siteFooter"></footer>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
