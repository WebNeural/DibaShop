<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | فروشگاه دیبا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=99">
</head>
<body data-page="login">

    <header id="siteHeader"></header>
    <div class="toast-container" id="toastContainer"></div>

    <main>
        <div class="auth-container">
            <h2>ورود</h2>
            <p class="error" id="errorBox" style="display:none;"></p>

            <form id="loginForm">
                <input type="email" id="email" placeholder="ایمیل" required>
                <input type="password" id="password" placeholder="رمز عبور" required>
                <button type="submit">ورود</button>
            </form>

            <p>حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a></p>
        </div>
    </main>

    <footer id="siteFooter"></footer>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
